<!doctype html>
<!-- v2.1: Dark theme + Health monitoring + Language graphs -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agency OS</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="shared/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Agency OS" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <h1>Agency OS</h1>
      <nav class="app-nav">
        <a href="index.html" class="active">Dashboard</a>
        <a href="pages/leads.html">Leads</a>
        <a href="pages/time.html">Time</a>
        <a href="pages/tasks.html">Tasks</a>
        <a href="pages/finance.html">Finance</a>
      </nav>
    </div>
    <span class="app-header-date" id="today"></span>
  </header>

  <main class="app-main">
    <section class="project-grid" id="project-grid">
      <!-- Project cards render here via js/dashboard.js -->
    </section>
  </main>

  <dialog id="project-detail-dialog" class="dialog-wide">
    <div id="project-detail-content"><!-- rendered via js/dashboard.js --></div>
  </dialog>

  <dialog id="project-form-dialog" class="dialog-wide">
    <div id="project-form-content"><!-- rendered via js/dashboard.js --></div>
  </dialog>

  <script src="shared/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/healthMonitor.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
