<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agency OS — Tasks</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Agency OS" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <h1>Agency OS</h1>
      <nav class="app-nav">
        <a href="../index.html">Dashboard</a>
        <a href="leads.html">Leads</a>
        <a href="time.html">Time</a>
        <a href="tasks.html" class="active">Tasks</a>
        <a href="finance.html">Finance</a>
      </nav>
    </div>
    <label class="task-filter">Project
      <select id="project-filter">
        <option value="">All projects</option>
      </select>
    </label>
  </header>

  <main class="app-main">
    <form id="task-form" class="quick-entry-form">
      <label class="quick-entry-note">Task
        <div class="input-with-mic">
          <input type="text" name="title" id="task-title-input" placeholder="What needs doing?" required />
          <button type="button" id="mic-btn" class="mic-btn" title="Dictate task">🎤</button>
        </div>
      </label>
      <label>Project
        <select name="projectId" id="task-project-select" required></select>
      </label>
      <label>Status
        <select name="status">
          <option value="today">Today</option>
          <option value="this_week">This week</option>
          <option value="done">Done</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary">Add task</button>
    </form>

    <div class="pipeline-board" id="task-board">
      <!-- Columns render here via js/tasks.js -->
    </div>
  </main>

  <script src="../shared/vendor/supabase.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/tasks.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("../sw.js");
    }
  </script>
</body>
</html>
